<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VR engine demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b14; color: #e9eef5; font: 15px/1.5 system-ui, sans-serif; }
  #bar { position: fixed; left: 0; right: 0; top: 0; padding: 8px 12px; background: rgba(7, 11, 20, 0.8); display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; z-index: 2; }
  #view { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  a { color: #ffd88a; }
</style>
</head>
<body>
<div id="bar">
  <b>VR engine demo</b> <span id="ver"></span>
  <label><input type="checkbox" id="lensOn" checked /> Fit the picture to the lenses</label>
  <label>Picture size <input type="range" id="lensSize" min="80" max="125" value="100" /> <output id="lensSizeO">100%</output></label>
  <span>Drag to look around.</span> <a href="../">Back to the portal</a>
</div>
<div id="view"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../v1/vr-engine.js"></script>
<script>
(function () {
  'use strict';
  document.getElementById('ver').textContent = 'engine ' + VRE.version;
  const { renderer, pace } = VRE.screen(() => true);
  renderer.autoClear = false;
  document.getElementById('view').appendChild(renderer.domElement);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(78, 1, 0.05, 200);
  scene.add(camera);
  const stereo = new THREE.StereoCamera();
  stereo.eyeSep = 0.064;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.0));
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), new THREE.MeshBasicMaterial({ color: 0x0b1424, side: THREE.BackSide })));
  const grid = new THREE.GridHelper(40, 40, 0x35507a, 0x1c2c47);
  grid.position.y = -1.6;
  scene.add(grid);
  // a ring of pillars, so that straight lines can be seen to stay straight through the lenses
  const box = new THREE.BoxGeometry(0.3, 3, 0.3), mat = new THREE.MeshLambertMaterial({ color: 0xff7a1f });
  for (let i = 0; i < 12; i++) { const m = new THREE.Mesh(box, mat), a = (i / 12) * Math.PI * 2; m.position.set(Math.sin(a) * 5, -0.1, -Math.cos(a) * 5); scene.add(m); }
  const sign = VRE.textPlane(1.6, 0.4, 800, 200);
  sign.position.set(0, 0.4, -2.5);
  scene.add(sign);
  VRE.drawText(sign, ['VR engine ' + VRE.version, 'One eye, mirrored']);
  const { lens, lensRender } = VRE.lens({ renderer, scene, camera, stereo });
  let yaw = 0, pitch = 0, down = null, last = 0;
  renderer.domElement.addEventListener('pointerdown', (e) => (down = [e.clientX, e.clientY]));
  addEventListener('pointerup', () => (down = null));
  addEventListener('pointermove', (e) => { if (!down) return; yaw -= (e.clientX - down[0]) * 0.004; pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.clientY - down[1]) * 0.004)); down = [e.clientX, e.clientY]; });
  function frame(now) {
    requestAnimationFrame(frame);
    pace(now, now - last); last = now;
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    camera.rotation.set(pitch, yaw, 0, 'YXZ'); camera.updateMatrixWorld(true);
    renderer.setScissorTest(false); renderer.clear();
    if (lens.on) lensRender(w, h);
    else {
      stereo.aspect = 0.5; stereo.update(camera); renderer.setScissorTest(true);
      renderer.setScissor(0, 0, w / 2, h); renderer.setViewport(0, 0, w / 2, h); renderer.render(scene, stereo.cameraL);
      renderer.setScissor(w / 2, 0, w / 2, h); renderer.setViewport(w / 2, 0, w / 2, h); renderer.render(scene, stereo.cameraR);
    }
  }
  requestAnimationFrame(frame);
  window.__demo = { lens, camera, look(y, p) { yaw = y * Math.PI / 180; pitch = p * Math.PI / 180; } };
})();
</script>
</body>
</html>
